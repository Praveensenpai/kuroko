name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/kuroko dist/
          cd dist
          tar -czvf kuroko-x86_64-unknown-linux-gnu.tar.gz kuroko
          sha256sum kuroko-x86_64-unknown-linux-gnu.tar.gz > kuroko-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kuroko-x86_64-unknown-linux-gnu.tar.gz
            dist/kuroko-x86_64-unknown-linux-gnu.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
